[project]
name = "tagger"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyarrow>=22",
  "regex>=2026.1.1",
]

[dependency-groups]
dev = ["pytest>=9"]
train = [
  "torch[device-gfx1201]==2.12.0+rocm7.14.1 ; sys_platform == 'win32'",
  "transformers>=5",
  "onnx>=1.19",
  "onnxscript>=0.5",
]
quantize = [
  "onnx>=1.19",
  "onnxruntime>=1.23",
]

[project.scripts]
prepare = "tagger.prepare:main"
train = "tagger.train:main"
export = "tagger.export:main"
prepare-learner = "tagger.learner:main"
prepare-synthetic = "tagger.synthetic:main"
quantize = "tagger.quantize:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
override-dependencies = ["triton ; sys_platform == 'linux'"]

[[tool.uv.index]]
name = "rocm"
url = "https://repo.amd.com/rocm/whl-multi-arch/"
ignore-error-codes = [403]

[tool.uv.sources]
torch = { index = "rocm", marker = "sys_platform == 'win32'" }
